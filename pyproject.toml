[project]
name = "is-lab1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "pyjwt>=2.9.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "safety>=3.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

